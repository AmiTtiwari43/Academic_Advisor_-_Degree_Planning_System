[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = [
    "tests",
    "common",
    "institutions",
    "accounts",
    "curriculum",
    "rule_engine",
    "academic_records",
    "degree_audit",
    "eligibility",
    "planning",
    "advising",
    "career_mapping",
    "analytics",
    "notifications",
    "audit_log",
]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "migrations",
    "frontend",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true

[tool.django-stubs]
django_settings_module = "config.settings.development"
