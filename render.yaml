services:
  - type: web
    name: academic-advisor-system
    runtime: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 20
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://academic-advisor-system.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://academic-advisor-system.onrender.com,https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: academic-advisor-db
          property: connectionString

databases:
  - name: academic-advisor-db
    plan: free
    databaseName: degree_planning
    user: degree_admin
